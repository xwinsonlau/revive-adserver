<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Revive Adserver — Zone 1 Preview</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    padding: 24px;
    max-width: 100%;
  }
  .card h1 {
    font-size: 18px;
    margin: 0 0 4px;
    color: #111827;
  }
  .card p.meta {
    color: #6b7280;
    font-size: 13px;
    margin: 0 0 16px;
  }
  .card p.meta code {
    background: #f3f4f6;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .ad-frame-wrap {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    max-width: 100%;
    text-align: center;
  }
  /* Revive's generated markup has no styling hooks of its own — this is
     all on us. display:block removes the default inline-image whitespace
     gap; the rest styles the "text below banner" link Revive outputs as a
     bare, unstyled <a> tag. */
  .ad-frame-wrap img,
  .ad-frame-wrap iframe {
    display: block;
    max-width: 100%;
    margin: 0 auto;
  }
  .ad-frame-wrap a {
    color: #2563eb;
    text-decoration: none;
  }
  .ad-frame-wrap a:hover {
    text-decoration: underline;
  }
  .ad-frame-wrap br + a {
    display: inline-block;
    padding: 10px 0;
    font-size: 13px;
    font-weight: 600;
  }
  .controls {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button {
    cursor: pointer;
    border: none;
    background: #111827;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
  }
  button:hover {
    background: #1f2937;
  }
  .status {
    font-size: 12px;
    color: #6b7280;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Revive Adserver — Zone 1 Preview</h1>
    <p class="meta">Serving from <code>http://localhost:8080</code> &middot; JavaScript invocation tag &middot; zone 1</p>

    <div class="ad-frame-wrap">
      <!-- Revive Adserver Javascript Tag - Generated with Revive Adserver v6.0.8 -->
      <script type='text/javascript'><!--//<![CDATA[
         var m3_u = (location.protocol=='https:'?'https://localhost:8080/www/delivery/ajs.php':'http://localhost:8080/www/delivery/ajs.php');
         var m3_r = Math.floor(Math.random()*99999999999);
         if (!document.MAX_used) document.MAX_used = ',';
         document.write ("<scr"+"ipt type='text/javascript' src='"+m3_u);
         document.write ("?zoneid=1");
         document.write ('&amp;cb=' + m3_r);
         document.write ("&amp;withtext=1");
         if (document.MAX_used != ',') document.write ("&amp;exclude=" + document.MAX_used);
         document.write (document.charset ? '&amp;charset='+document.charset : (document.characterSet ? '&amp;charset='+document.characterSet : ''));
         document.write ("&amp;loc=" + encodeURIComponent(window.location));
         if (document.referrer) document.write ("&amp;referer=" + encodeURIComponent(document.referrer));
         if (document.context) document.write ("&context=" + encodeURIComponent(document.context));
         document.write ("'><\/scr"+"ipt>");
      //]]>--></script><noscript><a href='http://localhost:8080/www/delivery/ck.php?n=a6836536&amp;cb=0' target='_blank'><img src='http://localhost:8080/www/delivery/avw.php?zoneid=1&amp;cb=0&amp;n=a6836536' border='0' alt='' /></a></noscript>
    </div>

    <div class="controls">
      <button id="reload-btn" type="button">Reload ad</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <script>
    document.getElementById('reload-btn').addEventListener('click', function () {
      // The JS tag calls document.write, which only works during the initial
      // page parse — reloading the page is the correct way to re-roll it.
      location.reload();
    });
    document.getElementById('status').textContent = 'Loaded at ' + new Date().toLocaleTimeString();
  </script>
</body>
</html>
