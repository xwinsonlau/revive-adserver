<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Revive Adserver — Zone 1 Preview</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    padding: 24px;
    max-width: 100%;
  }
  .card h1 {
    font-size: 18px;
    margin: 0 0 4px;
    color: #111827;
  }
  .card p.meta {
    color: #6b7280;
    font-size: 13px;
    margin: 0 0 16px;
  }
  .card p.meta code {
    background: #f3f4f6;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .ad-frame-wrap {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    line-height: 0;
    max-width: 100%;
  }
  .controls {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button {
    cursor: pointer;
    border: none;
    background: #111827;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
  }
  button:hover {
    background: #1f2937;
  }
  .status {
    font-size: 12px;
    color: #6b7280;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Revive Adserver — Zone 1 Preview</h1>
    <p class="meta">Serving from <code>http://localhost:8080</code> &middot; iframe invocation tag &middot; zone 1</p>

    <div class="ad-frame-wrap">
      <iframe id="a4943d99" name="a4943d99" src="" frameborder="0" scrolling="no" width="1350" height="488" allow="autoplay">
        <a href="" target="_blank"><img src="" border="0" alt="" /></a>
      </iframe>
    </div>

    <div class="controls">
      <button id="reload-btn" type="button">Reload ad</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <script>
    (function () {
      var ZONE_ID = 1;
      var HOST = 'http://localhost:8080'; // plain HTTP — this Docker setup doesn't terminate TLS on 8080
      var N = 'a82f54ce';

      var iframe = document.getElementById('a4943d99');
      var fallbackLink = iframe.querySelector('a');
      var fallbackImg = iframe.querySelector('img');
      var status = document.getElementById('status');

      function randomCacheBuster() {
        return Date.now() + '' + Math.floor(Math.random() * 100000);
      }

      function load() {
        var cb = randomCacheBuster();
        iframe.src = HOST + '/www/delivery/afr.php?zoneid=' + ZONE_ID + '&cb=' + cb;
        fallbackLink.href = HOST + '/www/delivery/ck.php?n=' + N + '&cb=' + cb;
        fallbackImg.src = HOST + '/www/delivery/avw.php?zoneid=' + ZONE_ID + '&cb=' + cb + '&n=' + N;
        status.textContent = 'Loaded at ' + new Date().toLocaleTimeString();
      }

      document.getElementById('reload-btn').addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
